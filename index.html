int main(int argc, char *argv[])
{
	<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NairaGigs - Find Local Talents</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --primary: #0066cc;
            --success: #25D366;
            --share-color: #00a2ff;
            --card-bg: #f4f4f4;
            --border: #dddddd;
            --comment-bg: #e9e9e9;
            --premium-glow: #ffcc00;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #ffffff;
                --primary: #3399ff;
                --success: #2e7d32;
                --share-color: #33b5e5;
                --card-bg: #1e1e1e;
                --border: #333333;
                --comment-bg: #2a2a2a;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .form-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            margin: 20px auto;
            border: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        .form-group input, .form-group input[type="file"], .form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-whatsapp {
            background-color: var(--success);
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .card.featured {
            border: 2px solid var(--premium-glow);
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.2);
        }
        .badge-premium {
            background-color: var(--premium-glow);
            color: #1a1a1a;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .gig-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .react-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-share {
            background-color: var(--share-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .comments-section {
            margin-top: 15px;
            border-top: 1px dashed var(--border);
            padding-top: 10px;
        }
        .comments-list {
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .comment-item {
            background-color: var(--comment-bg);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h2>🇳🇬 NairaGigs</h2>
        <button class="btn" style="width: auto;" id="refresh-btn" onclick="loadGigs()">Refresh Feed</button>
    </header>

    <div class="form-container">
        <h3>Post a New Gig / Job</h3>
        <div class="form-group">
            <label>Gig Title</label>
            <input type="text" id="title" placeholder="e.g., Creative Logo Design">
        </div>
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="author" placeholder="e.g., Tunde Dev">
        </div>
        <div class="form-group">
            <label>Your Email Address</label>
            <input type="email" id="email" placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label>WhatsApp Number (e.g., 2348012345678)</label>
            <input type="text" id="phone" placeholder="Include country code, no spaces">
        </div>
        <div class="form-group">
            <label>Price / Budget</label>
            <input type="text" id="price" placeholder="e.g., ₦20,000">
        </div>
        <div class="form-group">
            <label>Upload Job Photo / Sample</label>
            <input type="file" id="job-photo" accept="image/*">
        </div>
        <div class="form-group">
            <label>Tier Type</label>
            <select id="tier-type">
                <option value="free">Standard Post (Free)</option>
                <option value="featured">🌟 Premium Featured Post (₦1,000)</option>
            </select>
        </div>
        <button class="btn" onclick="submitGig()">Publish Gig Live</button>
    </div>

    <div class="grid" id="gigs-container"></div>

    <script>
        // CONFIGURATION: INSERT YOUR PAYSTACK PUBLIC KEY VALUE HERE
        const PAYSTACK_PUBLIC_KEY = 'pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'; 

        if (!localStorage.getItem('local_gigs')) {
            const seedData = [
                { id: 1, title: "Logo Design & Branding", author: "Tunde graphics", phone: "2348000000000", price: "₦15,000", image: "https://images.unsplash.com/photo-1626785774573-4b799315345d?w=400", isPremium: true, likes: 45, loves: 12, fires: 24, comments: [] },
                { id: 2, title: "Website SEO Optimization", author: "Amaka Code", phone: "2348000000000", price: "₦45,000", image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=400", isPremium: false, likes: 5, loves: 2, fires: 3, comments: [] }
            ];
            localStorage.setItem('local_gigs', JSON.stringify(seedData));
        }

        function loadGigs() {
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.innerText = "Refreshing...";
            
            let gigs = JSON.parse(localStorage.getItem('local_gigs')) || [];
            gigs.sort((a, b) => (b.isPremium ? 1 : 0) - (a.isPremium ? 1 : 0));
            
            let container = document.getElementById('gigs-container');
            container.innerHTML = '';
            
            gigs.forEach((gig, index) => {
                let phoneNum = gig.phone || "2348000000000";
                let waMsg = encodeURIComponent(`Hello ${gig.author}! I saw your gig "${gig.title}" on NairaGigs and I want to hire you.`);
                let waUrl = `https://wa.me/${phoneNum}?text=${waMsg}`;

                let likes = gig.likes || 0;
                let loves = gig.loves || 0;
                let fires = gig.fires || 0;

                let shareText = encodeURIComponent(`🔥 Check out this talent on NairaGigs!\n📌 Title: ${gig.title}\n💰 Budget: ${gig.price}\nContact: https://wa.me/${phoneNum}`);
                let whatsappShareUrl = `https://api.whatsapp.com/send?text=${shareText}`;

                let imageTag = gig.image ? `<img src="${gig.image}" class="gig-image">` : `<div class="gig-image" style="display:flex; align-items:center; justify-content:center; border:1px solid var(--border); color:gray;">No sample image</div>`;

                let commentsHtml = '';
                let commentsList = gig.comments || [];
                commentsList.forEach(c => {
                    commentsHtml += `<div class="comment-item"><strong>${c.name}:</strong> ${c.text}</div>`;
                });

                let premiumClass = gig.isPremium ? 'featured' : '';
                let premiumBadge = gig.isPremium ? '<span class="badge-premium">🌟 FEATURED</span>' : '';

                container.innerHTML += `
                    <div class="card ${premiumClass}">
                        ${premiumBadge}
                        <div>
                            ${imageTag}
                            <h3>${gig.title}</h3>
                            <p>By: ${gig.author}</p>
                            <p><strong>Budget: ${gig.price}</strong></p>
                            <a href="${waUrl}" target="_blank" class="btn btn-whatsapp">Contact on WhatsApp</a>
                        </div>
                        
                        <div class="action-bar">
                            <button class="react-btn" onclick="handleReaction(${index}, 'likes')">👍 <span>${likes}</span></button>
                            <button class="react-btn" onclick="handleReaction(${index}, 'loves')">❤️ <span>${loves}</span></button>
                            <button class="react-btn" onclick="handleReaction(${index}, 'fires')">🔥 <span>${fires}</span></button>
                            <a href="${whatsappShareUrl}" target="_blank" class="btn-share">📢 Share</a>
                        </div>
                        
                        <div class="comments-section">
                            <h4>Comments (${commentsList.length})</h4>
                            <div class="comments-list">${commentsHtml || '<p style="color:gray; font-size:12px;">No comments yet.</p>'}</div>
                            <div class="comment-input-group" style="display:flex; gap:5px;">
                                <input type="text" id="c-name-${index}" placeholder="Name" style="width:30%; padding:6px; border-radius:6px; border:1px solid var(--border); background-color:var(--bg-color); color:var(--text-color);">
                                <input type="text" id="c-text-${index}" placeholder="Add comment..." style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--border); background-color:var(--bg-color); color:var(--text-color);">
                                <button class="btn" style="width:auto; padding:6px 12px; font-size:13px;" onclick="addComment(${index})">Post</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            setTimeout(() => { refreshBtn.innerText = "Refresh Feed"; }, 400);
        }

        function handleReaction(index, type) {
            let gigs = JSON.parse(localStorage.getItem('local_gigs')) || [];
            gigs.sort((a, b) => (b.isPremium ? 1 : 0) - (a.isPremium ? 1 : 0));
            if (!gigs[index][type]) gigs[index][type] = 0;
            gigs[index][type] += 1;
            localStorage.setItem('local_gigs', JSON.stringify(gigs));
            loadGigs();
        }

        function submitGig() {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const price = document.getElementById('price').value;
            const tierType = document.getElementById('tier-type').value;
            const photoFile = document.getElementById('job-photo').files[0];

            if(!title || !author || !email || !phone || !price) {
                alert("Please fill out all fields, including your email address!");
                return;
            }

            const isPremium = (tierType === 'featured');

            const saveGigRecord = (imageDataUrl) => {
                if (isPremium) {
                    // INITIALIZE PAYSTACK AUTOMATED CHECKOUT WINDOW
                    let handler = PaystackPop.setup({
                        key: PAYSTACK_PUBLIC_KEY,
                        email: email,
                        amount: 1000 * 100, // Paystack counts in Kobo (1000 Naira = 100000 Kobo)
                        currency: "NGN",
                        callback: function(response) {
                            // Executed dynamically ONLY when the credit card charge clears successfully!
                            alert('Payment successful! Reference: ' + response.reference);
                            executeInsert(title, author, phone, price, imageDataUrl, true);
                        },
                        onClose: function() {
                            alert('Transaction cancelled. Your gig was not published.');
                        }
                    });
                    handler.openIframe();
                } else {
                    // Standard routing path for free listings
                    executeInsert(title, author, phone, price, imageDataUrl, false);
                }
            };

            if (photoFile) {
                const reader = new FileReader();
                reader.onloadend = () => saveGigRecord(reader.result);
                reader.readAsDataURL(photoFile);
            } else {
                saveGigRecord(null);
            }
        }

        function executeInsert(title, author, phone, price, imageDataUrl, premiumStatus) {
            let gigs = JSON.parse(localStorage.getItem('local_gigs')) || [];
            gigs.push({ id: Date.now(), title, author, phone, price, image: imageDataUrl, isPremium: premiumStatus, likes: 0, loves: 0, fires: 0, comments: [] });
            localStorage.setItem('local_gigs', JSON.stringify(gigs));
            
            document.getElementById('title').value = '';
            document.getElementById('author').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('price').value = '';
            document.getElementById('job-photo').value = '';
            document.getElementById('tier-type').value = 'free';
            loadGigs();
        }

        function addComment(gigIndex) {
            const nameInput = document.getElementById(`c-name-${gigIndex}`);
            const textInput = document.getElementById(`c-text-${gigIndex}`);
            const name = nameInput.value.trim();
            const text = textInput.value.trim();

            if (!name || !text) return;

            let gigs = JSON.parse(localStorage.getItem('local_gigs')) || [];
            gigs.sort((a, b) => (b.isPremium ? 1 : 0) - (a.isPremium ? 1 : 0));
            if (!gigs[gigIndex].comments) gigs[gigIndex].comments = [];
            gigs[gigIndex].comments.push({ name, text });
            
            localStorage.setItem('local_gigs', JSON.stringify(gigs));
            loadGigs();
        }

        window.onload = loadGigs;
    </script>
</body>
</html>

}
