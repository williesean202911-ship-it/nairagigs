<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B1020">
<title>Meridian Signal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0B1020;--panel:#131A33;--panel2:#1A2346;--line:#27325A;--text:#EEF2FF;--muted:#98A3C7;--up:#2DD4A8;--down:#FF6B8A;--amber:#FBBF24;--cyan:#22D3EE;--violet:#8B5CF6;--pink:#F472B6;--ink:#07101F;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(520px 300px at 100% -40px,rgba(139,92,246,.30),transparent 70%),radial-gradient(460px 280px at -10% -30px,rgba(34,211,238,.20),transparent 70%),var(--bg)}
#app{max-width:720px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
.muted{color:var(--muted)}.small{font-size:12px}.err{color:var(--down)}
.spacer{flex:1}.grow{flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:8px 0 12px}
.bar h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;flex:none}
.bt{display:flex;flex-direction:column;line-height:1.05}
.bt b{font-size:21px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--cyan),var(--violet) 62%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.bt span{font-size:10px;font-weight:700;letter-spacing:.42em;color:var(--muted);margin-top:3px}
.icon{min-height:44px;min-width:44px;padding:0 10px;border-radius:10px;color:var(--text);font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.live{color:var(--up);border-color:#2DD4A866;background:#2DD4A814}
.chip.closed{color:var(--amber);border-color:#FBBF2466;background:#FBBF2412}
.chip.demo{color:var(--pink);border-color:#F472B666;background:#F472B612}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:520px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;padding:12px 12px 10px;border-radius:14px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line)}
.tl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tv{font-size:28px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.ts{font-size:11px;color:var(--muted)}
.tabs{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.tab{min-height:44px;min-width:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-weight:700;background:var(--panel)}
.tab.on{border-color:transparent;color:var(--ink);background:linear-gradient(135deg,var(--cyan),var(--violet))}
.run{min-height:44px;margin-left:6px;padding:0 16px;border-radius:12px;border:1px solid var(--cyan);color:var(--cyan);font-weight:700}
.run:disabled{opacity:.5}
.note{padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:13px;color:var(--muted)}
.note b{color:var(--text)}
.note.warn{border-color:#FBBF2466;background:#FBBF2410}
.list{display:flex;flex-direction:column;gap:10px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sec{display:flex;align-items:center;gap:8px;margin:8px 0 0}
.sec i{width:8px;height:8px;border-radius:50%}
.sec span{color:var(--text)}
.empty{padding:14px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 14px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;text-align:left}
.row.static{min-height:0}
.row.ready{background:linear-gradient(160deg,#1E2A55,var(--panel2))}
button.row:active{transform:scale(.99)}
.ring{--p:0;--c:#2DD4A8;position:relative;display:inline-grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#27325A 0)}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.ring.lg{width:72px;height:72px}.ring.lg::before{inset:7px}.ring.lg b{font-size:20px}
.right{display:flex;align-items:center;gap:12px}
.right.col{flex-direction:column;align-items:flex-end;gap:0}
.pill{display:inline-block;flex:none;min-width:54px;padding:5px 11px;border:1px solid;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.07em;text-align:center}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card p{margin:8px 0 0}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.between.mid{align-items:center}
.big{font-size:28px;font-weight:700}.huge{font-size:30px;font-weight:600}
.banner{margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:13px}
.banner.go{border-color:transparent}
.head2{font-size:18px;font-weight:800;margin-bottom:6px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.chk .val{font-size:13px;text-align:right;max-width:42%}
.mark{flex:none;min-width:46px;padding:3px 0;border-radius:8px;border:1px solid;text-align:center;font-size:11px;font-weight:800;letter-spacing:.04em}
.mark.ok{color:var(--up);border-color:var(--up);background:#2DD4A818}
.mark.no{color:var(--down);border-color:var(--down);background:#FF6B8A18}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle}
#chart{width:100%;height:280px;display:block}
.ind{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.meter{position:relative;height:4px;border-radius:2px;background:var(--line);margin:6px 5px 2px}
.meter .tick{position:absolute;left:50%;top:-3px;width:1px;height:10px;background:#5C6A9A}
.meter .dot{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.size{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.foot{font-size:12px;color:var(--muted);margin:12px 0 0}
.form{display:flex;flex-direction:column;gap:6px}
.form label{font-size:12px;color:var(--muted);margin-top:8px}
.form input:not([type=checkbox]){width:100%;min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:15px ui-monospace,Menlo,Consolas,monospace}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px!important;color:var(--text)!important}
.tog input{width:22px;height:22px;accent-color:#22D3EE}
.primary{min-height:50px;margin-top:16px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--ink);font-weight:800}
.ghost{min-height:48px;border-radius:12px;border:1px solid var(--line);font-weight:700}
.ghost.slim{min-height:44px;margin-top:8px;padding:0 16px;color:var(--amber);border-color:var(--amber)}
.ghost.danger{width:100%;margin-top:14px;color:var(--down);border-color:#FF6B8A66}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(11,16,32,.92);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav button{flex:1;max-width:220px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:700}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--cyan);background:linear-gradient(160deg,#1A2346,#131A33)}
.primary.wide{width:100%;margin:0 0 14px}
#app.chartmode{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.ch{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px}
.hs{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:1px 0;scrollbar-width:none;flex:none}
.hs::-webkit-scrollbar{display:none}
.tfs{display:flex;gap:6px;flex:none}
.cc,.tg{flex:none;min-height:42px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;white-space:nowrap}
.cc.on{border-color:transparent;color:var(--ink);background:linear-gradient(135deg,var(--cyan),var(--violet))}
.tg.on{border-color:var(--cyan);color:var(--cyan);background:#22D3EE14}
.tg.tool.on{border-color:var(--amber);color:var(--amber);background:#FBBF2414}
.sepv{flex:none;width:1px;height:22px;background:var(--line);margin:0 4px}
.cst{white-space:nowrap;padding-left:6px}
.cvbox{position:relative;flex:1;min-height:200px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.stat{flex:none;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:13px}
@media (orientation:landscape) and (max-height:520px){#app.chartmode{padding-bottom:8px}.chartmode .nav,.chartmode #c-stat{display:none}}
@media (prefers-reduced-motion:no-preference){button{transition:transform .12s,background .15s}}

.prow.cp,.size.cp{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.size.cp{display:block;border-bottom:0}
.prow.cp:active,.size.cp:active,.tkc:active{background:rgba(34,211,238,.12)}
.cpi{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);border:1px solid var(--cyan);border-radius:999px;padding:3px 9px;margin-left:8px;flex:none}
.tap{margin:4px 0 8px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:#EEF2FF;color:#07101F;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.tkh{display:flex;align-items:center;gap:8px;padding:2px 2px 6px}
.tkh b{font-size:20px}
.dotl{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(45,212,168,.6);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(45,212,168,0)}100%{box-shadow:0 0 0 0 rgba(45,212,168,0)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tkc{flex:none;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:92px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));color:var(--text)}
.tkc .cl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tkc .mono{font-size:15px}
.tkc.all{border-color:var(--cyan)}.tkc.all .cl{color:var(--cyan)}
.tkn{padding:6px 2px}
#c-tk{flex:none}
.steps{margin:8px 0 12px;padding-left:20px;font-size:14px;line-height:1.5;color:var(--muted)}
.steps b{color:var(--text)}
.topic{font-size:18px;text-align:center;padding:12px;margin:8px 0;border:1px dashed var(--cyan);border-radius:12px;color:var(--cyan);word-break:break-all}
.prr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-height:52px}
.tagk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:6px}
.ghost.slim.on{color:var(--up);border-color:var(--up)}
.addp{margin-top:14px}
#pl-res{max-height:46vh;overflow-y:auto}
.note2{margin:6px 0 0;line-height:1.55}
.prr .ghost.slim{margin-top:0}
.prr .ghost,.prr .ghost.danger{width:auto;flex:none;min-width:96px;margin:0}
.prr .grow{flex:1;min-width:0}
.tfrow{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tfrow::-webkit-scrollbar{display:none}
.tfrow .tab{flex:none}
.okt{color:var(--up);font-weight:600}
.tfrow.wrapr{flex-wrap:wrap;overflow:visible;margin:6px 0 4px}
.ver{margin:18px 0 6px;text-align:center;font-size:12px;color:var(--muted)}
.pingcard .ghost{display:block;width:100%;margin:8px 0 0;min-height:48px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Signal Desk analysis engine v2. Pure functions, no DOM. */
(function (root) {
  var PAIRS = [
    { sym: 'EUR/USD', pip: 0.0001, pv: 10,   dec: 5, base: 1.0840, vol: 0.0006, seed: 11, bias: 1 },
    { sym: 'GBP/USD', pip: 0.0001, pv: 10,   dec: 5, base: 1.2610, vol: 0.0008, seed: 23, bias: -1 },
    { sym: 'USD/JPY', pip: 0.01,   pv: 6.5,  dec: 3, base: 154.20, vol: 0.09,   seed: 37, bias: 1 },
    { sym: 'AUD/USD', pip: 0.0001, pv: 10,   dec: 5, base: 0.6520, vol: 0.0005, seed: 41, bias: 0 },
    { sym: 'USD/CAD', pip: 0.0001, pv: 7.15, dec: 5, base: 1.3980, vol: 0.0006, seed: 53, bias: 0.4 },
    { sym: 'GBP/JPY', pip: 0.01,   pv: 6.5,  dec: 3, base: 194.30, vol: 0.12,   seed: 67, bias: -0.3 }
  ];

  /* Approximate USD value of one unit of each currency. Used only for demo prices and for the
     lot-size estimate, so it need not be exact. Check your broker's pip value before sizing. */
  var CCY = { USD: 1, EUR: 1.10, GBP: 1.27, AUD: 0.65, NZD: 0.60, CAD: 0.72, CHF: 1.12, JPY: 0.0065, SEK: 0.095, NOK: 0.093,
    DKK: 0.147, SGD: 0.75, HKD: 0.128, MXN: 0.055, ZAR: 0.055, TRY: 0.03, CNH: 0.14, PLN: 0.25, CZK: 0.043, HUF: 0.0028,
    THB: 0.028, INR: 0.012, ILS: 0.27, KRW: 0.00072, NGN: 0.00066, CNY: 0.14, BRL: 0.18, RUB: 0.011, AED: 0.272, SAR: 0.267, TWD: 0.031 };
  var FX_LIST = ('EUR/USD GBP/USD USD/JPY USD/CHF AUD/USD USD/CAD NZD/USD EUR/GBP EUR/JPY EUR/CHF EUR/AUD EUR/CAD EUR/NZD ' +
    'GBP/JPY GBP/CHF GBP/AUD GBP/CAD GBP/NZD AUD/JPY AUD/CHF AUD/CAD AUD/NZD NZD/JPY NZD/CHF NZD/CAD CAD/JPY CAD/CHF CHF/JPY ' +
    'USD/SGD USD/HKD USD/MXN USD/ZAR USD/TRY USD/NOK USD/SEK USD/DKK USD/PLN USD/CNH USD/CZK USD/HUF USD/THB USD/INR USD/ILS USD/KRW USD/NGN ' +
    'EUR/TRY EUR/NOK EUR/SEK EUR/DKK EUR/PLN EUR/CZK EUR/HUF EUR/ZAR EUR/MXN EUR/SGD EUR/HKD EUR/CNH ' +
    'GBP/SGD GBP/ZAR GBP/MXN GBP/NOK GBP/SEK GBP/PLN GBP/TRY AUD/SGD NZD/SGD SGD/JPY ZAR/JPY NOK/JPY SEK/JPY MXN/JPY TRY/JPY ' +
    'CHF/SGD CAD/SGD CHF/NOK CHF/SEK CHF/ZAR EUR/ILS USD/BRL USD/RUB USD/SAR USD/AED USD/TWD USD/CNY').split(' ');

  function hash(str) { var h = 7; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }

  /* Builds the settings for any pair written like EUR/USD. Returns null if a currency is unknown. */
  function makePair(sym) {
    sym = String(sym).toUpperCase().replace(/\s+/g, '');
    if (/^[A-Z]{6}$/.test(sym)) sym = sym.slice(0, 3) + '/' + sym.slice(3);
    for (var i = 0; i < PAIRS.length; i++) if (PAIRS[i].sym === sym) return PAIRS[i];
    var m = sym.match(/^([A-Z]{3})\/([A-Z]{3})$/);
    if (!m || m[1] === m[2] || !CCY[m[1]] || !CCY[m[2]]) return null;
    var base = CCY[m[1]] / CCY[m[2]], pip = base >= 20 ? 0.01 : 0.0001;
    return { sym: sym, pip: pip, pv: +(100000 * pip * CCY[m[2]]).toFixed(2), dec: pip === 0.01 ? 3 : 5,
      base: +base.toPrecision(5), vol: base * 0.0005, seed: hash(sym) % 1000, bias: 0 };
  }

  var TF = {
    '1min': { label: 'M1',  ms: 60000,   mult: 0.14, htf: '5min',  intraday: true, minStop: 4 },
    '5min': { label: 'M5',  ms: 300000,  mult: 0.30, htf: '15min', intraday: true, minStop: 6 },
    '15min': { label: 'M15', ms: 900000, mult: 0.55, htf: '30min', intraday: true, minStop: 8 },
    '30min': { label: 'M30', ms: 1800000, mult: 0.75, htf: '1h',    intraday: true, minStop: 8 },
    '1h':   { label: 'H1', ms: 3600000,  mult: 1,   htf: '4h', intraday: true },
    '4h':   { label: 'H4', ms: 14400000, mult: 1.9, htf: '1day' },
    '1day': { label: 'D1', ms: 86400000, mult: 3.6, htf: null },
    '1week': { label: 'W1', ms: 604800000, mult: 6.5, htf: null }
  };

  var SL_ATR = 1.5, TP1_ATR = 2.25, TP2_ATR = 3.75;   // 1:1.5 and 1:2.5 reward to risk

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Sample candles for demo mode, used when no API key is set. */
  function demoCandles(p, tf, runs) {
    var mult = TF[tf].mult;
    var idx = { '1h': 1, '4h': 2, '1day': 3, '5min': 4, '15min': 5, '1min': 6, '30min': 7, '1week': 8 }[tf];
    var r = rng(p.seed * 977 + idx * 131 + runs * 7919);
    var out = [], c = p.base;
    for (var i = 0; i < 120; i++) {
      var o = c;
      c = o + ((r() - 0.5) * 2 + p.bias * 0.2) * p.vol * mult;
      var w = r() * p.vol * mult * 0.8;
      out.push({ t: i, o: o, c: c, h: Math.max(o, c) + w * r(), l: Math.min(o, c) - w * r() });
    }
    return out;
  }

  function ema(a, n) {
    var k = 2 / (n + 1), o = [a[0]];
    for (var i = 1; i < a.length; i++) o.push(a[i] * k + o[i - 1] * (1 - k));
    return o;
  }

  function rsi(cl, n) {

      var closed = cs.slice(0, -1);   // analysis only uses closed candles
      closed.form = cs[cs.length - 1];   // kept so the chart can show the forming candle
      return closed;
    });
  }

  function stamp(cs, tf) {   // give sample candles real-looking UTC times
    var ms = A.TF[tf].ms, end = Math.floor(Date.now() / ms) * ms;
    return cs.map(function (c, i) { c.t = new Date(end - (cs.length - 1 - i) * ms).toISOString().slice(0, 19).replace('T', ' '); return c; });
  }
  function timeLabel(t, tf) {
    var m = String(t).match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/);
    if (!m) return String(t);
    return tf === '1day' || !m[4] ? m[3] + '/' + m[2] : m[3] + ' ' + m[4] + ':' + m[5];
  }

  /* ---------- live candle (the one still forming) ---------- */
  function parseT(t) { return Date.parse(String(t).replace(' ', 'T') + (String(t).length > 10 ? 'Z' : 'T00:00:00Z')); }
  function isoT(ms) { return new Date(ms).toISOString().slice(0, 19).replace('T', ' '); }
  function formFor(pair, tf) {
    var key = pair.sym + '|' + tf, hit = store[key];
    if (!hit || !hit.cs || !hit.cs.length) return null;
    var ms = A.TF[tf].ms, last = hit.cs[hit.cs.length - 1], start = parseT(last.t) + ms;
    if (isNaN(start) || Date.now() >= start + ms) return null;
    var lv = live[key];
    if (!lv || lv.start !== start) {
      var f = hit.cs.form;
      lv = live[key] = f && parseT(f.t) === start ? { start: start, t: f.t, o: f.o, h: f.h, l: f.l, c: f.c }
        : { start: start, t: isoT(start), o: last.c, h: last.c, l: last.c, c: last.c };
    }
    return lv;
  }
  function withLive(pair, tf, cs) {
    var lv = formFor(pair, tf);

  }
  function applyTick(pair, tf, price) {
    var lv = formFor(pair, tf); if (!lv || !isFinite(price)) return false;
    lv.c = price; lv.h = Math.max(lv.h, price); lv.l = Math.min(lv.l, price); return true;
  }
  function tick() {
    if (screen !== 'chart' || document.hidden) return;
    var pair = WL()[selected], tf = cfg.tf, now = Date.now();
    var hit = store[pair.sym + '|' + tf];
    if (!demoMode() && !A.marketOpen()) return;
    if (hit && hit.cs && !formFor(pair, tf) && !busy && !demoMode() && now - lastTry > 20000) { lastTry = now; refresh(false); return; }   // a new candle should exist
    if (demoMode()) {
      var lv = formFor(pair, tf); if (!lv) return;
      applyTick(pair, tf, lv.c + (Math.random() - 0.5) * pair.vol * 0.3 + (lv.o - lv.c) * 0.01);
      liveAt = now; return pushChart();
    }
    if (!A.marketOpen() || tickBusy || now - lastTick < 15000) return;
    tickBusy = true; lastTick = now;
    throttle().then(function () {
      return fetch('https://api.twelvedata.com/price?symbol=' + encodeURIComponent(pair.sym) + '&apikey=' + encodeURIComponent(cfg.key));
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.price && applyTick(pair, tf, +j.price)) { liveAt = Date.now(); pushChart(); }
    }).catch(function () {}).then(function () { tickBusy = false; });
  }

  /* Returns the candles for pair and timeframe, refetching only when a new candle should exist. */
  function candles(pair, tf, force) {
    var key = pair.sym + '|' + tf, hit = store[key];
    if (demoMode()) {
      if (!hit || force) store[key] = { cs: stamp(A.demoCandles(pair, tf, runs), tf), at: Date.now() };
      return Promise.resolve(store[key]);
    }
    if (hit && !hit.error && !force && !A.due(hit.at, A.TF[tf].ms)) return Promise.resolve(hit);
    return fetchCandles(pair, tf).then(function (cs) {
      store[key] = { cs: cs, at: Date.now() }; return store[key];
    }).catch(function (e) {
      var old = store[key];
      store[key] = { cs: old && old.cs, at: old ? old.at : 0, error: e.message || 'Failed' };
      return store[key];
    });
  }

  function activeTfs() {
    var out = [cfg.tf];
    (cfg.pingTfs || []).forEach(function (t) { if (out.indexOf(t) < 0 && A.TF[t]) out.push(t); });
    return out;
  }
  function pingsOn(tf) { return (cfg.pingTfs || []).indexOf(tf) >= 0; }
  function evaluate(pair) { evals[pair.sym] = evalFor(pair, cfg.tf); }
  function evalFor(pair, tfk) {
    var info = A.TF[tfk], hit = store[pair.sym + '|' + tfk];
    if (!hit || !hit.cs || hit.cs.length < 60) return { error: hit && hit.error || 'No data' };
    var res = A.analyse(hit.cs), pl = A.plan(res, pair, +cfg.balance, +cfg.risk), htf = null;
    if (info.htf && res.signal !== 'WAIT') {
      var h = store[pair.sym + '|' + info.htf];
      htf = h && h.cs && h.cs.length >= 60 ? A.analyse(h.cs) : 'pending';
    }
    return {
      res: res, plan: pl, error: hit.error, cs: hit.cs,
      ready: A.readiness(res, pl, htf, {

      })
    };
  }

  /* ---------- track record ---------- */
  function openTrade(sym, tf, dir) {
    return track.some(function (s) { return s.status === 'open' && s.sym === sym && s.tf === tf && s.dir === dir; });
  }
  function trackAdd(pair, ev, tfk) {
    var cs = ev.cs, p = ev.plan, dir = p.dir;
    if (openTrade(pair.sym, tfk, dir)) return;
    track.push({ id: pair.sym + '|' + tfk + '|' + cs[cs.length - 1].t, sym: pair.sym, tf: tfk, dir: dir, dec: pair.dec,
      entry: p.entry, sl: p.sl, tp1: p.tp1, t: String(cs[cs.length - 1].t), at: Date.now(), status: 'open', r: 0, conf: ev.res.conf });
    if (track.length > 200) track = track.slice(-200);
    save('ms_track', track);
  }
  /* Follows each open signal on later candles. If target and stop are both touched inside one candle it counts as a loss. */
  function trackResolve(pair, tf, cs) {
    var changed = false;
    track.forEach(function (s) {
      if (s.status !== 'open' || s.sym !== pair.sym || s.tf !== tf) return;
      var after = cs.filter(function (c) { return String(c.t) > s.t; });
      for (var i = 0; i < after.length; i++) {
        var c = after[i];
        var hitSL = s.dir > 0 ? c.l <= s.sl : c.h >= s.sl;
        var hitTP = s.dir > 0 ? c.h >= s.tp1 : c.l <= s.tp1;
        if (hitSL) { s.status = 'loss'; s.r = -1; break; }
        if (hitTP) { s.status = 'win'; s.r = 1.5; break; }
      }
      if (s.status === 'open' && after.length >= 48) { s.status = 'expired'; s.r = 0; }
      if (s.status !== 'open') {
        changed = true;
        if (cfg.alerts && s.status !== 'expired') {
          notify((s.status === 'win' ? 'Target hit: ' : 'Stopped out: ') + s.sym + ' (' + tfLabel(s.tf) + ')',
            s.status === 'win' ? 'Your ' + (s.dir > 0 ? 'buy' : 'sell') + ' reached take profit 1, +1.5R.' : 'Your ' + (s.dir > 0 ? 'buy' : 'sell') + ' hit its stop, -1R.');
        }
      }
    });
    if (changed) save('ms_track', track);
  }
  function stats() {
    var done = track.filter(function (s) { return s.status === 'win' || s.status === 'loss'; });
    var wins = done.filter(function (s) { return s.status === 'win'; }).length;
    var net = done.reduce(function (a, s) { return a + s.r; }, 0);
    return { closed: done.length, wins: wins, rate: done.length ? Math.round(wins / done.length * 100) : 0, net: net,
      open: track.filter(function (s) { return s.status === 'open'; }).length };
  }

  /* Price alerts are checked on every closed candle, using its high and low. */
  function checkPriceAlerts(pair, cs) {
    var list = draws[pair.sym], changed = false;
    if (!list) return;
    list.forEach(function (d) {
      if (!d.alert || d.fired || d.tf !== cfg.tf) return;
      var hit = cs.some(function (c) { return String(c.t) > d.t && (d.dir > 0 ? c.h >= d.price : c.l <= d.price); });
      if (hit) {
        d.fired = true; changed = true;
        notify('Price alert: ' + pair.sym, 'Price reached ' + fmt(d.price, pair.dec) + ' on a ' + tfLabel(cfg.tf) + ' candle.');
      }
    });
    if (changed) save('ms_draw', draws);
  }

  function alertIfReady(pair, tfk, ev) {
    if (!ev || !ev.res) return;
    var key = pair.sym + '|' + tfk, prev = readyState[key];
    var now = { ready: ev.ready.ok, sig: ev.res.signal };
    readyState[key] = now; save('ms_ready', readyState);
    if (prev === undefined || demoMode() || !now.ready) return;
    if (prev.ready && prev.sig === now.sig) return;
    trackAdd(pair, ev, tfk);
    if (!cfg.alerts) return;
    var pg = lastPing[key];
    if (pg && pg.sig === now.sig && Date.now() - pg.at < 4 * A.TF[tfk].ms) return;   // no repeats while it flickers
    lastPing[key] = { sig: now.sig, at: Date.now() }; save('ms_ping', lastPing);
    var p = ev.plan, f = function (v) { return fmt(v, pair.dec); };
    notify(now.sig + ' ' + pair.sym + ' is ready (' + tfLabel(tfk) + ')',
      'Entry ' + f(p.entry) + '  Stop ' + f(p.sl) + '  Target ' + f(p.tp1) + '\nTarget 2 ' + f(p.tp2) + '\nSize ' + p.lots.toFixed(2) + ' lots  Strength ' + ev.res.conf + '%',
      { sym: pair.sym, tf: tfk });
  }

  function refresh(force) {
    if (busy) return Promise.resolve();
    if (!demoMode() && !A.marketOpen()) {
      statusText = 'Market closed'; WL().forEach(evaluate); render(); return Promise.resolve();
    }
    busy = true; statusText = 'Checking'; render();
    if (demoMode() && force) runs += 1;
    var chain = Promise.resolve();
    activeTfs().forEach(function (tf) {
      var htf = A.TF[tf].htf, shown = tf === cfg.tf;
      WL().forEach(function (pair) {
        chain = chain.then(function () { return candles(pair, tf, force); }).then(function (hit) {
          if (!hit.cs || hit.cs.length < 60) return;
          if (!demoMode()) trackResolve(pair, tf, hit.cs);
          if (shown) checkPriceAlerts(pair, hit.cs);
          var res = A.analyse(hit.cs);
          if (htf && res.signal !== 'WAIT') return candles(pair, htf, force);   // only fetch the higher timeframe for real candidates
        }).then(function () {
          var ev = evalFor(pair, tf);
          if (shown) evals[pair.sym] = ev;
          if (pingsOn(tf)) alertIfReady(pair, tf, ev);
          if (shown) render();
        });
      });
    });
    return chain.then(function () {
      busy = false;
      var errs = WL().filter(function (p) { return evals[p.sym] && evals[p.sym].error && !evals[p.sym].res; }).length;
      statusText = errs ? errs + ' pair' + (errs > 1 ? 's' : '') + ' failed' : 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      render();
    });
  }

  function schedule() {
    if (timer) clearInterval(timer);
    var mins = Math.max(1, +cfg.every || 5);
    activeTfs().forEach(function (t) { mins = Math.min(mins, Math.max(1, A.TF[t].ms / 60000)); });   // never slower than the fastest candle
    timer = setInterval(function () { refresh(false); }, mins * 60000);
  }

  /* ---------- chart ---------- */
  function drawChart(canvas, pair, ev) {
    var cs = ev.cs.slice(-60), res = ev.res, n = cs.length, off = ev.cs.length - n, plan = ev.plan;
    var dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    var g = canvas.getContext('2d'); g.scale(dpr, dpr);
    var hi = Math.max.apply(null, cs.map(function (c) { return c.h; }));
    var lo = Math.min.apply(null, cs.map(function (c) { return c.l; }));
    if (plan) [plan.sl, plan.tp1, plan.tp2].forEach(function (v) { hi = Math.max(hi, v); lo = Math.min(lo, v); });
    var pad = (hi - lo) * 0.06; hi += pad; lo -= pad;
    var axisW = 64, pw = w - axisW;
    function Y(v) { return (hi - v) / (hi - lo) * h; }
    function X(i) { return (i + 0.5) / n * pw; }
    g.lineWidth = 1; g.strokeStyle = '#1E2850'; g.fillStyle = MUTED; g.font = '10px monospace';
    [0.2, 0.4, 0.6, 0.8].forEach(function (f) {
      var y = f * h; g.beginPath(); g.moveTo(0, y); g.lineTo(pw, y); g.stroke();
      var near = plan && [plan.sl, plan.tp1, plan.tp2, plan.entry].some(function (v) { return Math.abs(Y(v) - y) < 12; });
      if (!near) g.fillText(fmt(hi - f * (hi - lo), pair.dec), pw + 6, y + 3);
    });
    var bw = Math.max(2, pw / n * 0.6);
    cs.forEach(function (c, i) {
      var col = c.c >= c.o ? UP : DOWN;
      g.strokeStyle = col; g.fillStyle = col;
      g.beginPath(); g.moveTo(X(i), Y(c.h)); g.lineTo(X(i), Y(c.l)); g.stroke();
      g.fillRect(X(i) - bw / 2, Y(Math.max(c.o, c.c)), bw, Math.max(1.5, Math.abs(Y(c.o) - Y(c.c))));
    });

      for (var i = 0; i < n; i++) { var x = X(i), y = Y(arr[off + i]); if (i) g.lineTo(x, y); else g.moveTo(x, y); }
      g.stroke(); g.setLineDash([]);
    }
    line(res.bbUp, '#6B79A8', [4, 4]); line(res.bbLo, '#6B79A8', [4, 4]);
    line(res.e50, VIOLET); line(res.e20, '#EEF2FF');
    if (plan) {

        .forEach(function (L) {
          var y = Y(L[1]);

          g.fillStyle = INK; g.font = '10px monospace'; g.fillText(L[0], pw + 6, y + 3);
        });
    }
  }

  /* ---------- views ---------- */
  var LOGO = '<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + CYAN + '"/><stop offset="1" stop-color="' + VIOLET + '"/></linearGradient></defs>' +
    '<circle cx="20" cy="20" r="16" fill="none" stroke="url(#lg)" stroke-width="3"/><ellipse cx="20" cy="20" rx="6.5" ry="16" fill="none" stroke="url(#lg)" stroke-width="2.2"/>' +
    '<path d="M4 20h32" stroke="url(#lg)" stroke-width="2.2"/><circle cx="26.5" cy="12" r="3.2" fill="' + PINK + '"/></svg>';

  function pill(sig, filled) {

    }).join('') + '</nav>';

  function row(pair, i) {

  }

  function viewList() {
    var groups = { ready: [], watch: [], none: [] };
    WL().forEach(function (p, i) {
      var ev = evals[p.sym], k = !ev || !ev.res ? 'none' : ev.ready.ok ? 'ready' : ev.res.signal === 'WAIT' ? 'none' : 'watch';

      tile('Win rate', st.closed ? st.rate + '%' : '-', CYAN, st.closed ? st.closed + ' closed' : 'no results yet') + '</div>';
    h += '<div class="tfrow" id="tfrow">';

    h += '</div><div class="tabs"><span class="muted small">' + statusText + '</span><span class="spacer"></span><button class="run" data-act="run"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Checking' : 'Check now') + '</button></div>';
    var perDay = 0; activeTfs().forEach(function (t) { perDay += WL().length * Math.round(86400000 / A.TF[t].ms); });
    if (!demoMode() && perDay > 700) h += '<div class="note warn"><b>Heavy on the free key.</b> ' + WL().length + ' pairs on ' + activeTfs().map(tfLabel).join(', ') + ' needs about ' + perDay + ' data calls a day. A free Twelve Data key allows 800. Watch fewer pairs or use a longer timeframe, or some will fail late in the day.</div>';
    if (!demoMode() && !open) h += '<div class="note">Forex is closed until Sunday evening (UTC). Showing the last prices from Friday.</div>';
    if (cfg.alerts && perm !== 'granted' && perm !== 'unknown') {

    }
    var sec = function (title, color, arr, empty) {
      if (!arr.length && !empty) return '';

        (arr.length ? arr.map(function (x) { return row(x[0], x[1]); }).join('') : '<div class="empty">' + empty + '</div>');
    };
    h += '<div class="list">' + sec('Ready to trade', UP, groups.ready, 'Nothing is ready yet. You will get a notification the moment something is.') +
      sec('Watching', AMBER, groups.watch) + sec('No trade', MUTED, groups.none) + '</div>' +
      '<button class="ghost wide addp" data-nav="pairs">+ Add or remove pairs (' + WL().length + ' watched)</button><div class="ver">v' + VERSION + '</div>';
    h += '<p class="foot">' + (demoMode() ? 'These are sample prices, not the real market. Add a Twelve Data key in Settings for live signals. ' : '') +
      'A pair is ready only when every check passes: signal strength, trend and momentum agree, trend strength, higher timeframe, not overextended, a stop wider than the spread' + (A.TF[cfg.tf].intraday && !demoMode() ? ' and London or New York hours' : '') + '. No signal is guaranteed. Not financial advice.</p>';
    return h + nav();
  }

  function indRow(name, value, text, m, mark) {

    var r = ev.res, pl = ev.plan, rd = ev.ready, f = function (v) { return fmt(v, p.dec); }, out = [];
    out.push(p.sym + ' is in a ' + (r.trend > 0 ? 'rising' : 'falling') + ' trend (EMA 20 ' + (r.trend > 0 ? 'above' : 'below') + ' EMA 50) and momentum is ' +
      (r.mom > 0 ? 'positive' : 'negative') + '.');
    out.push(r.adx >= 25 ? 'The trend has real strength (ADX ' + r.adx.toFixed(0) + ').' : r.adx >= 20 ? 'The trend is moderate (ADX ' + r.adx.toFixed(0) + ').' : 'The market is drifting sideways (ADX ' + r.adx.toFixed(0) + '), so signals here are less reliable.');
    out.push(r.rsi > 70 ? 'RSI ' + r.rsi.toFixed(0) + ' says price is stretched upward.' : r.rsi < 30 ? 'RSI ' + r.rsi.toFixed(0) + ' says price is stretched downward.' : 'RSI ' + r.rsi.toFixed(0) + ' is not stretched.');
    if (pl) {
      out.push(rd.ok ? 'Every check passes, so this is a ' + (pl.dir > 0 ? 'buy' : 'sell') + ' setup: ' + f(pl.entry) + ' in, risking ' + pl.slPips.toFixed(0) + ' pips for ' + pl.tp1Pips.toFixed(0) + ' to ' + pl.tp2Pips.toFixed(0) + '.'
        : 'It leans ' + (pl.dir > 0 ? 'buy' : 'sell') + ' but is not ready: ' + rd.waiting.toLowerCase() + '.');
      out.push('The idea is wrong if price reaches ' + f(pl.sl) + '.');
    } else out.push('No side has a clear edge, so the safest move is to wait.');
    return '<div class="card"><div class="label">Analyst note <span class="tagk">Rules-based</span></div><p class="note2">' + esc(out.join(' ')) + '</p></div>';

  /* ---------- chart screen ---------- */
  function serFor(pair, cs) {

  function ticket(pair, ev) {

      var f = ev && ev.plan, lv = [];
      if (f) lv = [{ label: 'TP2', price: f.tp2, color: CYAN, dash: [6, 4] }, { label: 'TP1', price: f.tp1, color: UP, dash: [6, 4] },
        { label: 'Entry', price: f.entry, color: '#EEF2FF' }, { label: 'Stop', price: f.sl, color: DOWN, dash: [6, 4] }];
      chartInst.levels = lv;
      chartInst.markers = hit.cs.length >= 61 ? btFor(pair, hit.cs).trades.map(function (t) { return { i: t.i, dir: t.dir, out: t.out }; }) : [];
      chartInst.setData(all, serFor(pair, all), pair.dec, cfg.tf, keep);
    } else { chartInst.cs = null; chartInst.draw(); }
  }

  var pairsChanged = false;
  function refreshPairsUi() {
    var r = document.getElementById('pl-res'), h = document.getElementById('pl-have'), n = document.getElementById('pl-n');
    if (r) r.innerHTML = pairResults(plq); if (h) h.innerHTML = haveList(); if (n) n.textContent = WL().length;
  }
  function leavePairs() {
    if (!pairsChanged) return;
    pairsChanged = false; selected = 0; chartKey = null;
    WL().forEach(evaluate); setTimeout(function () { refresh(false); }, 0);
  }
  $app.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'pl-q') { plq = e.target.value; var r = document.getElementById('pl-res'); if (r) r.innerHTML = pairResults(plq); }
  });

  /* ---------- events ---------- */
  $app.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.ptf) {
      var ix = cfg.pingTfs.indexOf(t.dataset.ptf);
      if (ix >= 0) cfg.pingTfs.splice(ix, 1); else cfg.pingTfs.push(t.dataset.ptf);
      cfg.pingTfs = TFS.map(function (x) { return x[0]; }).filter(function (x) { return cfg.pingTfs.indexOf(x) >= 0; });
      save('ms_cfg', cfg); schedule(); t.classList.toggle('on', ix < 0);
      var nt = document.getElementById('ptf-note'); if (nt) nt.textContent = pingNote();
      return setTimeout(function () { refresh(false); }, 0);
    }
    if (t.dataset.copy != null) { if (!t.dataset.copy) return toast('Set balance and risk in Settings first'); return copyText(t.dataset.copy, t.dataset.cl || ''); }
    if (t.dataset.copyall) {
      var cp = WL()[selected], cev = evals[cp.sym];
      if (cev && cev.plan) return copyText(ticketText(cp, cev.plan, cev.res.signal), 'whole trade');
      return;
    }
    if (t.dataset.padd) {
      if (watch.length >= 20) return toast('Maximum 20 pairs');
      if (watch.indexOf(t.dataset.padd) < 0) watch.push(t.dataset.padd);
      save('ms_watch', watch); pairsChanged = true; refreshPairsUi(); return toast('Added ' + t.dataset.padd);
    }
    if (t.dataset.prem) {
      if (watch.length <= 1) return toast('Keep at least one pair');
      watch = watch.filter(function (x) { return x !== t.dataset.prem; });
      save('ms_watch', watch); pairsChanged = true; refreshPairsUi(); return toast('Removed ' + t.dataset.prem);
    }
    if (t.dataset.csym != null) { selected = +t.dataset.csym; chartKey = null; return render(); }
    if (t.dataset.ind) { chartFlags[t.dataset.ind] = !chartFlags[t.dataset.ind]; save('ms_chart', chartFlags); return render(); }
    if (t.dataset.tool && chartInst) {
      chartInst.tool = chartInst.tool === t.dataset.tool ? null : t.dataset.tool; chartInst.pending = null;
      document.getElementById('c-top').innerHTML = chartTop(); return chartInst.draw();
    }
    if (t.dataset.nav) { if (screen === 'pairs' && t.dataset.nav !== 'pairs') leavePairs(); screen = t.dataset.nav; clearArmed = false; window.scrollTo(0, 0); return render(); }
    if (t.dataset.pair != null) { selected = +t.dataset.pair; screen = 'detail'; window.scrollTo(0, 0); return render(); }
    if (t.dataset.tf) { cfg.tf = t.dataset.tf; save('ms_cfg', cfg); schedule(); WL().forEach(evaluate); render(); return refresh(false); }
    var act = t.dataset.act;
    if (act === 'back') { if (screen === 'pairs') leavePairs(); screen = 'list'; return render(); }
    if (act === 'open-chart') { screen = 'chart'; chartKey = null; window.scrollTo(0, 0); return render(); }
    if (act === 'ch-undo' && chartInst) { chartInst.draws.pop(); save('ms_draw', draws); return chartInst.draw(); }
    if (act === 'ch-clear' && chartInst) { chartInst.draws.length = 0; save('ms_draw', draws); return chartInst.draw(); }
    if (act === 'ch-fit' && chartInst) { chartInst.reset(); return chartInst.draw(); }
    if (act === 'run') return refresh(true);
    if (act === 'copy-ptf') return cfg.pingTfs.length ? copyText(cfg.pingTfs.join(','), 'timeframes') : toast('Pick at least one timeframe first');
    if (act === 'copy-pairs') return copyText(watch.join(','), 'pair list');
    if (act === 'copy-topic') return copyText(cfg.topic, 'topic name');
    if (act === 'ntfy-test') {
      var nm = document.getElementById('f-msg2'); nm.textContent = 'Sending...';
      return fetch('https://ntfy.sh/' + encodeURIComponent(cfg.topic), { method: 'POST', body: 'Test ping: this is how a ready trade will arrive.', headers: { Title: 'Meridian Signal', Priority: 'high' } })
        .then(function (r) { nm.textContent = r.ok ? 'Sent. If the ntfy app is subscribed to this topic, it pings now.' : 'Could not send (' + r.status + ').'; })
        .catch(function () { nm.textContent = 'Could not reach ntfy. Check your internet.'; });
    }
    if (act === 'perm-list') return askPermission().then(render);
    if (act === 'clear') {
      if (!clearArmed) { clearArmed = true; return render(); }
      track = []; save('ms_track', track); clearArmed = false; return render();
    }
    if (act === 'save') {
      var oldKey = cfg.key;
      cfg.key = document.getElementById('f-key').value.trim();
      cfg.balance = +document.getElementById('f-bal').value || 0;
      cfg.risk = +document.getElementById('f-risk').value || 0;
      cfg.minConf = Math.min(100, Math.max(40, +document.getElementById('f-conf').value || 65));
      cfg.every = Math.max(1, +document.getElementById('f-every').value || 5);
      cfg.alerts = document.getElementById('f-alerts').checked;
      save('ms_cfg', cfg); schedule();
      if (cfg.key !== oldKey) { store = {}; evals = {}; readyState = {}; save('ms_ready', readyState); }
      else WL().forEach(evaluate);
      screen = 'list'; render(); return refresh(false);
    }
    var msg = document.getElementById('f-msg');
    if (act === 'perm') return askPermission().then(function (ok) { msg.textContent = ok ? 'Notifications are on.' : 'Notifications are blocked. Allow them in your phone settings.'; });
    if (act === 'test') {
      return askPermission().then(function (ok) {
        if (!ok) { msg.textContent = 'Notifications are blocked. Allow them in your phone settings.'; return; }
        return notify('Meridian Signal', 'Test alert: you will get a message like this the moment a trade is ready.').then(function () { msg.textContent = 'Sent.'; });
      });
    }
  });

  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(false); });

  schedule();
  setInterval(tick, 1500);
  var lnx = LN();
  if (lnx && lnx.addListener) lnx.addListener('localNotificationActionPerformed', function (ev) {
    var x = ev && ev.notification && ev.notification.extra;
    for (var i = 0; x && x.sym && i < WL().length; i++) if (WL()[i].sym === x.sym) { selected = i; screen = 'detail'; render(); }
  });
  channel();
  checkPermission().then(render);
  render();
  refresh(false);
})();

</script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
