name: Forex alerts

on:
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remember what was already sent
        uses: actions/cache@v4
        with:
          path: state
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-
      - name: Check for trades that are ready
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAIRS: ${{ vars.PAIRS }}
          INTERVAL: ${{ vars.INTERVAL || '15min' }}
          MIN_CONF: "65"
          ACCOUNT_BALANCE: "5000"
          RISK_PCT: "1"
        run: python forex_alerts.py
